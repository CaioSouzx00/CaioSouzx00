<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Caio Souza - Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A1226"/>
      <stop offset="1" stop-color="#0B1E4A"/>
    </linearGradient>

    <radialGradient id="glowA">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="txt" x1="-1" y1="0" x2="0" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#3B82F6"/>
      <animate attributeName="x1" values="-1;0.2" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>

    <radialGradient id="fadeGrad" cx="500" cy="130" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0.15" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade">
      <rect width="1000" height="260" fill="url(#fadeGrad)"/>
    </mask>

    <clipPath id="round">
      <rect width="1000" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- grid em movimento -->
    <g mask="url(#fade)">
      <rect x="-40" y="-40" width="1080" height="340" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- orbs de luz -->
    <circle cx="180" cy="80" r="190" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 30;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="210" r="210" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 -30;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- particulas -->
    <g fill="#93C5FD">
      <circle cx="120" cy="190" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/><animate attributeName="cy" values="190;170;190" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="60" r="1.4"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="60;78;60" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="215" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="215;198;215" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="45" r="1.5"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4.4s" repeatCount="indefinite"/><animate attributeName="cy" values="45;62;45" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="95" r="1.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/><animate attributeName="cy" values="95;78;95" dur="7.5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="170" r="1.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.8s" repeatCount="indefinite"/><animate attributeName="cy" values="170;188;170" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="50" r="1.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="50;66;50" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- linha de scan -->
    <rect x="0" y="-4" width="1000" height="2" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 270" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal -->
    <text x="36" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#60A5FA" fill-opacity="0.85">caio@dev:~$<tspan fill="#93C5FD">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="964" y="42" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#64748B">Goiás, BR</text>

    <!-- nome -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1.2s" begin="0.2s" fill="freeze"/>
      <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="1" fill="url(#txt)">Caio Souza</text>
    </g>

    <!-- linha de acento -->
    <rect x="500" y="148" width="0" height="2" rx="1" fill="#3B82F6">
      <animate attributeName="x" from="500" to="430" dur="0.9s" begin="0.9s" fill="freeze"/>
      <animate attributeName="width" from="0" to="140" dur="0.9s" begin="0.9s" fill="freeze"/>
    </rect>

    <!-- cargo -->
    <text x="500" y="182" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#93C5FD" opacity="0">
      BACKEND ENGINEER
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- tagline -->
    <text x="500" y="214" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#60A5FA" opacity="0">
      Rust  ·  APIs escaláveis  ·  Agentes de IA  ·  Criptografia Homomórfica
      <animate attributeName="opacity" from="0" to="0.9" dur="0.9s" begin="1.7s" fill="freeze"/>
    </text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="259" rx="15.5" stroke="#1B2540"/>
</svg>
