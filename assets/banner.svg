<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="JetBrains Mono, Fira Code, Consolas, monospace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#000000"/><stop offset=".55" stop-color="#14082B"/><stop offset="1" stop-color="#3B1597"/>
  </linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A78BFA" stroke-opacity=".08"/></pattern>
  <clipPath id="c"><rect width="1000" height="260" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <circle cx="830" cy="125" r="220" fill="url(#glow)"><animate attributeName="r" values="200;245;200" dur="6s" repeatCount="indefinite"/></circle>

  <rect width="1000" height="34" fill="#0A0614" fill-opacity=".85"/>
  <circle cx="24" cy="17" r="5" fill="#7C3AED"/><circle cx="42" cy="17" r="5" fill="#5B21B6"/><circle cx="60" cy="17" r="5" fill="#2E1065"/>
  <text x="84" y="21" font-size="12" fill="#8B7BB8">caio@archlinux: ~/portfolio</text>

  <g stroke="#A78BFA" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="5 5" fill="none">
    <line x1="690" y1="100" x2="810" y2="72"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="690" y1="100" x2="835" y2="165"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="690" y1="100" x2="720" y2="200"><animate attributeName="stroke-dashoffset" values="0;-20" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="810" y1="72" x2="930" y2="118"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.7s" repeatCount="indefinite"/></line>
    <line x1="835" y1="165" x2="930" y2="118"><animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/></line>
    <line x1="810" y1="72" x2="835" y2="165"/>
  </g>
  <g fill="#0A0A0F" stroke="#A78BFA" stroke-width="1.6">
    <circle cx="690" cy="100" r="9"/><circle cx="810" cy="72" r="9"/><circle cx="835" cy="165" r="9"/>
    <circle cx="930" cy="118" r="9"/><circle cx="720" cy="200" r="9"/>
  </g>
  <g fill="#7C3AED">
    <circle cx="690" cy="100" r="3.5"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="72" r="3.5"><animate attributeName="opacity" values="1;.25;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="835" cy="165" r="3.5"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="118" r="3.5"><animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="200" r="3.5"><animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>
  <g font-size="10" fill="#A78BFA" fill-opacity=".85" text-anchor="middle">
    <text x="690" y="126">gateway</text><text x="810" y="55">services</text><text x="835" y="191">events</text>
    <text x="930" y="144">data</text><text x="720" y="226">agents</text>
  </g>

  <text x="48" y="92" font-size="17" fill="#A78BFA">$ whoami</text>
  <rect x="140" y="77" width="9" height="19" fill="#C4B5FD"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="46" y="158" font-size="66" font-weight="700" fill="url(#name)" letter-spacing="-1">Caio Souza</text>
  <text x="48" y="196" font-size="17" fill="#C4B5FD">Software Developer · CTO · Software Architect · QA</text>
  <text x="48" y="226" font-size="12.5" fill="#8B7BB8">Arquitetura de sistemas · APIs escaláveis · Automação &amp; Cloud</text>
</g>
<rect x=".5" y=".5" width="999" height="259" rx="14" fill="none" stroke="#4C1D95"/>
</svg>