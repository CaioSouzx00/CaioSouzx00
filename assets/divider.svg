<svg width="1000" height="24" viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1793D1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC3F5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5DDF9" stop-opacity="1"/>
      <stop offset="1" stop-color="#5CC3F5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="11" width="1000" height="1" fill="url(#base)"/>

  <rect x="-200" y="10.5" width="200" height="2" rx="1" fill="url(#shine)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="480" y="3" width="40" height="18" rx="4" fill="#0B0E13" stroke="#1C2430"/>
  <text x="500" y="16" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#1793D1">&gt;_
    <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.6;0.8;1" dur="2.2s" repeatCount="indefinite"/>
  </text>
</svg>
