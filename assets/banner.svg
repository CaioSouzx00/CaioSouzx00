<svg width="1000" height="424" viewBox="0 0 1000 424" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal caio@archlinux - Software Developer, CTO, Software Architect, QA">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1793D1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hexGlow">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="win">
      <rect x="20" y="16" width="960" height="392" rx="12"/>
    </clipPath>

    <clipPath id="cmd">
      <rect x="210" y="74" width="0" height="24">
        <animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54;63;76" dur="0.8s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- janela -->
  <rect x="20" y="16" width="960" height="392" rx="12" fill="#0B0E13"/>

  <g clip-path="url(#win)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15">

    <!-- barra de titulo -->
    <rect x="20" y="16" width="960" height="36" fill="#10151C"/>
    <rect x="20" y="52" width="960" height="1" fill="#1C2430"/>
    <circle cx="46" cy="34" r="6" fill="#2A3441"/>
    <circle cx="66" cy="34" r="6" fill="#2A3441"/>
    <circle cx="86" cy="34" r="6" fill="#1793D1"/>
    <text x="500" y="39" text-anchor="middle" font-size="13" fill="#6B7A8C">caio@archlinux: ~</text>

    <!-- scan suave -->
    <rect x="20" y="-70" width="960" height="70" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- prompt + comando -->
    <text x="48" y="92" textLength="162" lengthAdjust="spacingAndGlyphs" opacity="0">
      <tspan fill="#1793D1" font-weight="700">caio@archlinux</tspan><tspan fill="#6B7A8C">:</tspan><tspan fill="#5CC3F5">~</tspan><tspan fill="#E6EDF3">$ </tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.2s" fill="freeze"/>
    </text>
    <g clip-path="url(#cmd)">
      <text x="210" y="92" textLength="72" lengthAdjust="spacingAndGlyphs" fill="#E6EDF3">neofetch</text>
    </g>

    <!-- hexagono de arquitetura (original) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze"/>
      <circle cx="870" cy="236" r="96" fill="url(#hexGlow)"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 870 236" to="360 870 236" dur="70s" repeatCount="indefinite"/>
        <circle cx="870" cy="236" r="88" stroke="#1C3A52" stroke-dasharray="3 7"/>
        <g stroke="#1793D1" stroke-opacity="0.55" stroke-width="1">
          <line x1="870" y1="236" x2="940" y2="236"/>
          <line x1="870" y1="236" x2="905" y2="296.6"/>
          <line x1="870" y1="236" x2="835" y2="296.6"/>
          <line x1="870" y1="236" x2="800" y2="236"/>
          <line x1="870" y1="236" x2="835" y2="175.4"/>
          <line x1="870" y1="236" x2="905" y2="175.4"/>
          <polygon points="940,236 905,296.6 835,296.6 800,236 835,175.4 905,175.4" stroke-opacity="0.35"/>
        </g>
        <g fill="#0B0E13" stroke="#5CC3F5" stroke-width="1.5">
          <circle cx="940" cy="236" r="4"><animate attributeName="r" values="3;5.5;3" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
          <circle cx="905" cy="296.6" r="4"><animate attributeName="r" values="3;5.5;3" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
          <circle cx="835" cy="296.6" r="4"><animate attributeName="r" values="3;5.5;3" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
          <circle cx="800" cy="236" r="4"><animate attributeName="r" values="3;5.5;3" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
          <circle cx="835" cy="175.4" r="4"><animate attributeName="r" values="3;5.5;3" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
          <circle cx="905" cy="175.4" r="4"><animate attributeName="r" values="3;5.5;3" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
        </g>
      </g>
      <circle cx="870" cy="236" r="7" fill="#1793D1">
        <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- saida do neofetch -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
      <text x="48" y="128" fill="#1793D1" font-weight="700">caio@archlinux</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.75s" fill="freeze"/>
      <text x="48" y="148" fill="#2E3A48">──────────────</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.0s" fill="freeze"/>
      <text x="48" y="176" fill="#1793D1" font-weight="700">Role</text>
      <text x="168" y="176" fill="#E6EDF3">Software Developer · CTO · Software Architect · QA</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.25s" fill="freeze"/>
      <text x="48" y="200" fill="#1793D1" font-weight="700">Focus</text>
      <text x="168" y="200" fill="#E6EDF3">Backend · Arquitetura de Sistemas · Qualidade · Automação</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.5s" fill="freeze"/>
      <text x="48" y="224" fill="#1793D1" font-weight="700">Backend</text>
      <text x="168" y="224" fill="#E6EDF3">Java · Spring Boot · PHP · Laravel · Node.js · TypeScript</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.75s" fill="freeze"/>
      <text x="48" y="248" fill="#1793D1" font-weight="700">Data</text>
      <text x="168" y="248" fill="#E6EDF3">PostgreSQL · MySQL · MongoDB · Oracle</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.0s" fill="freeze"/>
      <text x="48" y="272" fill="#1793D1" font-weight="700">Infra</text>
      <text x="168" y="272" fill="#E6EDF3">Linux · Docker · CI/CD · GitHub Actions · Fly.io</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.25s" fill="freeze"/>
      <text x="48" y="296" fill="#1793D1" font-weight="700">AI</text>
      <text x="168" y="296" fill="#E6EDF3">NVIDIA NIM · n8n · Agentes · Skills · LLM APIs</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.5s" fill="freeze"/>
      <text x="48" y="320" fill="#1793D1" font-weight="700">Studying</text>
      <text x="168" y="320" fill="#E6EDF3">Rust · Criptografia Homomórfica</text>
    </g>

    <!-- paleta -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.8s" fill="freeze"/>
      <rect x="48"  y="340" width="30" height="14" fill="#0B1F2E"/>
      <rect x="78"  y="340" width="30" height="14" fill="#0F3B57"/>
      <rect x="108" y="340" width="30" height="14" fill="#12618C"/>
      <rect x="138" y="340" width="30" height="14" fill="#1793D1"/>
      <rect x="168" y="340" width="30" height="14" fill="#5CC3F5"/>
      <rect x="198" y="340" width="30" height="14" fill="#A5DDF9"/>
      <rect x="228" y="340" width="30" height="14" fill="#E6EDF3"/>
      <rect x="258" y="340" width="30" height="14" fill="#6B7A8C"/>
    </g>

    <!-- prompt final com cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.2s" fill="freeze"/>
      <text x="48" y="384" textLength="162" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#1793D1" font-weight="700">caio@archlinux</tspan><tspan fill="#6B7A8C">:</tspan><tspan fill="#5CC3F5">~</tspan><tspan fill="#E6EDF3">$ </tspan>
      </text>
      <rect x="212" y="370" width="9" height="17" fill="#1793D1">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="20.5" y="16.5" width="959" height="391" rx="11.5" stroke="#1C2430"/>
</svg>
