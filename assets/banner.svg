<svg width="1000" height="440" viewBox="0 0 1000 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal caio@archlinux - Software Developer, CTO, Software Architect, QA">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1793D1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="logoGlow">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#1793D1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1793D1" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <radialGradient id="fadeGrad" cx="500" cy="230" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0.2" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade">
      <rect width="1000" height="440" fill="url(#fadeGrad)"/>
    </mask>

    <clipPath id="win">
      <rect x="20" y="16" width="960" height="408" rx="12"/>
    </clipPath>

    <!-- digitacao: sudo pacman -S caio (19 caracteres) -->
    <clipPath id="cmdA">
      <rect x="210" y="74" width="0" height="24">
        <animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- digitacao: neofetch (8 caracteres) -->
    <clipPath id="cmdB">
      <rect x="210" y="74" width="0" height="24">
        <animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54;63;76" dur="0.8s" begin="4.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- janela -->
  <rect x="20" y="16" width="960" height="408" rx="12" fill="#0B0E13"/>

  <g clip-path="url(#win)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15">

    <!-- grid sutil em movimento -->
    <g mask="url(#fade)">
      <rect x="-20" y="-20" width="1040" height="480" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- barra de titulo -->
    <rect x="20" y="16" width="960" height="36" fill="#10151C"/>
    <rect x="20" y="52" width="960" height="1" fill="#1C2430"/>
    <circle cx="46" cy="34" r="6" fill="#2A3441"/>
    <circle cx="66" cy="34" r="6" fill="#2A3441"/>
    <circle cx="86" cy="34" r="6" fill="#1793D1"/>
    <text x="500" y="39" text-anchor="middle" font-size="13" fill="#6B7A8C">caio@archlinux: ~</text>

    <!-- scan -->
    <rect x="20" y="-70" width="960" height="70" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 540" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ FASE A: pacman ============ -->
    <g>
      <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="3.9s" fill="freeze"/>

      <text x="48" y="92" textLength="162" lengthAdjust="spacingAndGlyphs" opacity="0">
        <tspan fill="#1793D1" font-weight="700">caio@archlinux</tspan><tspan fill="#6B7A8C">:</tspan><tspan fill="#5CC3F5">~</tspan><tspan fill="#E6EDF3">$ </tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.2s" fill="freeze"/>
      </text>
      <g clip-path="url(#cmdA)">
        <text x="210" y="92" textLength="171" lengthAdjust="spacingAndGlyphs" fill="#E6EDF3">sudo pacman -S caio</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.7s" fill="freeze"/>
        <text x="48" y="128"><tspan fill="#1793D1" font-weight="700">::</tspan><tspan fill="#E6EDF3" font-weight="700"> Synchronizing package databases...</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.0s" fill="freeze"/>
        <text x="64" y="152" fill="#6B7A8C">core</text>
        <text x="420" y="152" fill="#1793D1">done</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.2s" fill="freeze"/>
        <text x="64" y="176" fill="#6B7A8C">extra</text>
        <text x="420" y="176" fill="#1793D1">done</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.4s" fill="freeze"/>
        <text x="48" y="208"><tspan fill="#1793D1" font-weight="700">::</tspan><tspan fill="#E6EDF3" font-weight="700"> Resolving dependencies...</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.6s" fill="freeze"/>
        <text x="48" y="240" fill="#C9D6E2">Packages (1)  <tspan fill="#5CC3F5">caio</tspan>  <tspan fill="#6B7A8C">[Developer · CTO · Architect · QA]</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.8s" fill="freeze"/>
        <text x="48" y="276" fill="#C9D6E2">(1/1) installing caio</text>
        <rect x="330" y="263" width="400" height="14" rx="2" stroke="#12618C"/>
        <rect x="332" y="265" width="0" height="10" rx="1" fill="#1793D1">
          <animate attributeName="width" from="0" to="396" dur="0.7s" begin="2.9s" fill="freeze"/>
        </rect>
        <text x="745" y="276" fill="#5CC3F5" opacity="0">100%
          <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.6s" fill="freeze"/>
        </text>
      </g>
    </g>

    <!-- ============ FASE B: neofetch ============ -->
    <text x="48" y="92" textLength="162" lengthAdjust="spacingAndGlyphs" opacity="0">
      <tspan fill="#1793D1" font-weight="700">caio@archlinux</tspan><tspan fill="#6B7A8C">:</tspan><tspan fill="#5CC3F5">~</tspan><tspan fill="#E6EDF3">$ </tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.4s" fill="freeze"/>
    </text>
    <g clip-path="url(#cmdB)">
      <text x="210" y="92" textLength="72" lengthAdjust="spacingAndGlyphs" fill="#E6EDF3">neofetch</text>
    </g>

    <!-- slot do logo (preenchido pelo script com o icone oficial) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="5.4s" fill="freeze"/>

      <circle cx="168" cy="236" r="132" fill="url(#logoGlow)">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
      </circle>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 168 236" to="360 168 236" dur="40s" repeatCount="indefinite"/>
        <circle cx="168" cy="236" r="112" stroke="#1C3A52" stroke-dasharray="3 8"/>
        <circle cx="280" cy="236" r="3.5" fill="#5CC3F5"/>
        <circle cx="56" cy="236" r="2.5" fill="#1793D1"/>
        <circle cx="168" cy="124" r="2" fill="#A5DDF9"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 168 236" to="0 168 236" dur="65s" repeatCount="indefinite"/>
        <circle cx="168" cy="236" r="92" stroke="#12618C" stroke-opacity="0.5" stroke-dasharray="1 10"/>
        <circle cx="260" cy="236" r="2" fill="#1793D1"/>
      </g>

      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite"/>
        <image x="88" y="156" width="160" height="160" href="ARCHLOGO_SLOT" preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>

    <!-- saida do neofetch -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.6s" fill="freeze"/>
      <text x="330" y="150" fill="#1793D1" font-weight="700">caio@archlinux</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.8s" fill="freeze"/>
      <text x="330" y="170" fill="#2E3A48">──────────────</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.0s" fill="freeze"/>
      <text x="330" y="198" fill="#1793D1" font-weight="700">Role</text>
      <text x="450" y="198" fill="#E6EDF3">Software Developer · CTO · Architect · QA</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.22s" fill="freeze"/>
      <text x="330" y="222" fill="#1793D1" font-weight="700">Focus</text>
      <text x="450" y="222" fill="#E6EDF3">Backend · Arquitetura · Qualidade · Automação</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.44s" fill="freeze"/>
      <text x="330" y="246" fill="#1793D1" font-weight="700">Backend</text>
      <text x="450" y="246" fill="#E6EDF3">Java · Spring Boot · PHP · Laravel · Node · TS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.66s" fill="freeze"/>
      <text x="330" y="270" fill="#1793D1" font-weight="700">Data</text>
      <text x="450" y="270" fill="#E6EDF3">PostgreSQL · MySQL · MongoDB · Oracle</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.88s" fill="freeze"/>
      <text x="330" y="294" fill="#1793D1" font-weight="700">Infra</text>
      <text x="450" y="294" fill="#E6EDF3">Linux · Docker · CI/CD · Fly.io</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="7.1s" fill="freeze"/>
      <text x="330" y="318" fill="#1793D1" font-weight="700">AI</text>
      <text x="450" y="318" fill="#E6EDF3">NVIDIA NIM · n8n · Agentes · Skills</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="7.32s" fill="freeze"/>
      <text x="330" y="342" fill="#1793D1" font-weight="700">Studying</text>
      <text x="450" y="342" fill="#E6EDF3">Rust · Criptografia Homomórfica</text>
    </g>

    <!-- paleta -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="7.6s" fill="freeze"/>
      <rect x="330" y="362" width="30" height="14" fill="#0B1F2E"/>
      <rect x="360" y="362" width="30" height="14" fill="#0F3B57"/>
      <rect x="390" y="362" width="30" height="14" fill="#12618C"/>
      <rect x="420" y="362" width="30" height="14" fill="#1793D1"/>
      <rect x="450" y="362" width="30" height="14" fill="#5CC3F5"/>
      <rect x="480" y="362" width="30" height="14" fill="#A5DDF9"/>
      <rect x="510" y="362" width="30" height="14" fill="#E6EDF3"/>
      <rect x="540" y="362" width="30" height="14" fill="#6B7A8C"/>
    </g>

    <!-- prompt final com cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="8s" fill="freeze"/>
      <text x="48" y="408" textLength="162" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#1793D1" font-weight="700">caio@archlinux</tspan><tspan fill="#6B7A8C">:</tspan><tspan fill="#5CC3F5">~</tspan><tspan fill="#E6EDF3">$ </tspan>
      </text>
      <rect x="212" y="394" width="9" height="17" fill="#1793D1">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="20.5" y="16.5" width="959" height="407" rx="11.5" stroke="#1C2430"/>
</svg>
